{% extends "base.html" %}
{% block title %}Login — Oforugo Provision Global{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-icon">O</div>
            <h2>Welcome Back</h2>
            <p>Sign in to your Oforugo account</p>
        </div>
        <div class="auth-body">
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-input" placeholder="you@example.com" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-input" placeholder="Enter your password" required>
                </div>
                <div class="form-group" style="display:flex;align-items:center;gap:8px;">
                    <input type="checkbox" name="remember" id="remember" style="accent-color:var(--green);">
                    <label for="remember" style="font-size:0.88rem;cursor:pointer;">Remember me</label>
                </div>
                <button type="submit" class="btn-primary" style="width:100%;padding:14px;">Sign In</button>
            </form>
            <div class="auth-footer" style="margin-top:20px;">
                Don't have an account? <a href="{{ url_for('auth.register') }}">Create one free</a>
            </div>
            <!-- <div class="auth-footer" style="margin-top:12px;padding:12px;background:var(--green-light);border-radius:8px;font-size:0.82rem;">
                <strong>Demo Admin:</strong> admin@oforugo.com / admin123
            </div> -->
        </div>
    </div>
</div>
{% endblock %}
