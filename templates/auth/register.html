{% extends "base.html" %}
{% block title %}Create Account — Oforugo Provision Global{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card" style="max-width:540px;">
        <div class="auth-header">
            <div class="logo-icon">O</div>
            <h2>Create Account</h2>
            <p>Join thousands of customers shopping with Oforugo</p>
        </div>
        <div class="auth-body">
            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Username *</label>
                        <input type="text" name="username" class="form-input" placeholder="johndoe" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Full Name *</label>
                        <input type="text" name="full_name" class="form-input" placeholder="John Doe" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address *</label>
                    <input type="email" name="email" class="form-input" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Phone Number *</label>
                    <input type="tel" name="phone" class="form-input" placeholder="08012345678" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Password *</label>
                        <input type="password" name="password" class="form-input" placeholder="Min 6 characters" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm Password *</label>
                        <input type="password" name="confirm_password" class="form-input" placeholder="Repeat password" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="width:100%;padding:14px;">Create Account</button>
            </form>
            <div class="auth-footer" style="margin-top:20px;">
                Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
